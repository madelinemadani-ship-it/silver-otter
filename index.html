<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baby Name Deck</title>
<style>
:root{--bg:#f7f4ef;--card:#fffdf9;--ink:#2f2a25;--muted:#7d746b;--accent:#b78c72;--line:#e5ddd4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,serif}
.app{max-width:800px;margin:auto;padding:20px 16px 45px}h1{font-weight:500;margin:0;font-size:30px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:16px}
button,select{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:13px;padding:11px 13px;cursor:pointer}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}.tabs button{font-size:13px;padding:10px 6px}.tabs .active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.panel{display:none}.panel.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:28px;min-height:410px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 12px 30px rgba(60,45,35,.07)}
.name{font-size:clamp(38px,10vw,72px);line-height:1.08}.choice{width:100%;padding:20px;font-size:clamp(24px,6vw,42px)}.vs{font:14px system-ui;color:var(--muted);margin:20px 0}
.small{font:13px system-ui;color:var(--muted);text-align:center;margin:12px 0}.ratingBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:500px;margin-top:28px}.ratingBtns button{padding:18px;font-size:18px}
.table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}.table th,.table td{padding:10px;text-align:left;border-bottom:1px solid var(--line)}.table th{font:12px system-ui;color:var(--muted)}
.highlight{background:#fffaf3}.section{margin:22px 0}.section h2{font-size:21px;font-weight:500;margin:0 0 8px}.pill{display:inline-block;padding:7px 10px;border:1px solid var(--line);border-radius:20px;background:var(--card);margin:3px;font-family:system-ui;font-size:14px}
.setup{max-width:520px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:34px;text-align:center}.setup button{width:100%;margin:8px 0;padding:18px;font-size:20px}
.hidden{display:none}
</style></head>
<body>
<div id="setup" class="setup"><h1>Who are you?</h1><p class="small">Choose once on this device. You can change it later.</p><button onclick="setPerson('Madeline')">Madeline</button><button onclick="setPerson('Daniel')">Daniel</button></div>
<div id="app" class="app hidden">
<div class="top"><div><h1>Baby Name Deck</h1><div class="small" id="who"></div></div><button onclick="changePerson()">Switch person</button></div>
<div class="tabs"><button data-tab="deck">Deck</button><button data-tab="rate">Rate</button><button data-tab="rank">Head-to-head</button><button data-tab="compare">Compare</button></div>

<section id="deck" class="panel"><div class="card"><div class="name" id="deckName"></div><div class="small">Swipe or tap Next</div></div><div style="display:flex;gap:8px;margin-top:12px"><button onclick="shuffleDeck()">🔀 Shuffle</button><button onclick="nextDeck()">Next →</button></div></section>

<section id="rate" class="panel"><div class="card"><div class="name" id="rateName"></div><div class="small">How do you feel about this name?</div><div class="ratingBtns">
<button onclick="simpleVote('love')">❤️ Love it</button><button onclick="simpleVote('like')">👍 Like it</button>
<button onclick="simpleVote('maybe')">🤔 Maybe</button><button onclick="simpleVote('no')">👎 No</button></div></div><div class="small" id="rateProgress"></div></section>

<section id="rank" class="panel"><div class="card"><button id="a" class="choice"></button><div class="vs">vs.</div><button id="b" class="choice"></button></div><div class="small">Tap the name you prefer. Your head-to-head results are saved separately.</div></section>

<section id="compare" class="panel"><div id="compareBody"></div></section>
</div>
<script>
const SB_URL='https://jlfconzsleyildjjivzc.supabase.co', SB_KEY='sb_publishable_l9sjIeFk_4wQfTahLMaH0Q_mxi-L6i3', TOKEN='CU5VvJPM8yPiGDC8lG95l2oZq0iqcCDJ';
let person=localStorage.getItem('babyNamePerson')||'', names=[], ratings={Madeline:{},Daniel:{}}, simple={Madeline:{},Daniel:{}}, pair=[], deck=[], deckIndex=0, rateIndex=0;
async function rpc(fn,args){const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});if(!r.ok)throw Error(await r.text());return r.json()}
function setPerson(p){person=p;localStorage.setItem('babyNamePerson',p);document.getElementById('setup').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('who').textContent='Using this device as '+p;load()}
function changePerson(){localStorage.removeItem('babyNamePerson');location.reload()}
async function load(){
 names=await rpc('get_name_deck',{p_token:TOKEN});
 for(const p of ['Madeline','Daniel']){
   const rows=await rpc('get_name_ratings',{p_token:TOKEN,p_person:p});ratings[p]={};rows.forEach(x=>ratings[p][x.name]=x);
   simple[p]=await rpc('get_simple_ratings',{p_token:TOKEN,p_person:p});
 }
 shuffleDeck();newPair();showRate();renderCompare();
}
function stat(p,n){return ratings[p][n]||{name:n,wins:0,losses:0,elo:1500}}
function shuffleDeck(){deck=[...names].sort(()=>Math.random()-.5);deckIndex=0;showDeck()}
function showDeck(){document.getElementById('deckName').textContent=deck[deckIndex]||'No names'}
function nextDeck(){if(!deck.length)return;deckIndex=(deckIndex+1)%deck.length;showDeck()}
function showRate(){let unrated=names.filter(n=>!simple[person][n]);if(!unrated.length)unrated=names;rateIndex=Math.floor(Math.random()*unrated.length);document.getElementById('rateName').textContent=unrated[rateIndex]||'All done!';document.getElementById('rateProgress').textContent=Object.keys(simple[person]).length+' of '+names.length+' rated'}
async function simpleVote(r){const n=document.getElementById('rateName').textContent;if(!n||n==='All done!')return;simple[person][n]=r;await rpc('save_simple_rating',{p_token:TOKEN,p_person:person,p_name:n,p_rating:r});showRate();renderCompare()}
function newPair(){if(names.length<2)return;let a,b;do{a=names[Math.floor(Math.random()*names.length)];b=names[Math.floor(Math.random()*names.length)]}while(a===b);pair=[a,b];document.getElementById('a').textContent=a;document.getElementById('b').textContent=b}
async function vote(w,l){
 const W=stat(person,w),L=stat(person,l),k=24,ew=1/(1+10**((L.elo-W.elo)/400)),el=1/(1+10**((W.elo-L.elo)/400));
 const nw={wins:W.wins+1,losses:W.losses,elo:Math.round((W.elo+k*(1-ew))*10)/10},nl={wins:L.wins,losses:L.losses+1,elo:Math.round((L.elo-k*el)*10)/10};
 ratings[person][w]={name:w,...nw};ratings[person][l]={name:l,...nl};
 await Promise.all([rpc('save_name_rating',{p_token:TOKEN,p_person:person,p_name:w,p_wins:nw.wins,p_losses:nw.losses,p_elo:nw.elo}),rpc('save_name_rating',{p_token:TOKEN,p_person:person,p_name:l,p_wins:nl.wins,p_losses:nl.losses,p_elo:nl.elo})]);
 newPair();renderCompare()
}
function pills(arr){return arr.length?arr.map(x=>'<span class="pill">'+x+'</span>').join(''):'<div class="small">None yet</div>'}
const ratingInfo={
  love:{emoji:'❤️',label:'Love it'},
  like:{emoji:'👍',label:'Like it'},
  maybe:{emoji:'🤔',label:'Maybe'},
  no:{emoji:'👎',label:'No'}
};
function comboLabel(a,b){
  if(!a||!b)return '';
  return `${ratingInfo[a].emoji} ${ratingInfo[b].emoji}`;
}
function renderCompare(){
 const bothLove=names.filter(n=>simple.Madeline[n]==='love'&&simple.Daniel[n]==='love');
 const bothPositive=names.filter(n=>['love','like'].includes(simple.Madeline[n])&&['love','like'].includes(simple.Daniel[n])&&!bothLove.includes(n));
 const bothMaybe=names.filter(n=>simple.Madeline[n]==='maybe'&&simple.Daniel[n]==='maybe');
 const exactAgreement=names.filter(n=>simple.Madeline[n]&&simple.Daniel[n]&&simple.Madeline[n]===simple.Daniel[n]);
 const disagreements=names.filter(n=>simple.Madeline[n]&&simple.Daniel[n]&&simple.Madeline[n]!==simple.Daniel[n])
   .map(n=>({name:n,m:simple.Madeline[n],d:simple.Daniel[n]}))
   .sort((a,b)=>{
     const score={love:4,like:3,maybe:2,no:1};
     return Math.abs(score[b.m]-score[b.d])-Math.abs(score[a.m]-score[a.d]);
   });
 const oneLove=names.filter(n=>(simple.Madeline[n]==='love') !== (simple.Daniel[n]==='love') && simple.Madeline[n]&&simple.Daniel[n]);
 const incomplete=names.filter(n=>!!simple.Madeline[n] !== !!simple.Daniel[n]);
 const unrated=names.filter(n=>!simple.Madeline[n]&&!simple.Daniel[n]);
 const ratingRows=names.filter(n=>simple.Madeline[n]||simple.Daniel[n]).map(n=>({
   name:n,m:simple.Madeline[n]||'',d:simple.Daniel[n]||''
 })).sort((a,b)=>{
   const score={love:4,like:3,maybe:2,no:1,'':0};
   return (score[b.m]+score[b.d])-(score[a.m]+score[a.d]);
 });
 const rows=names.map(n=>({name:n,m:stat('Madeline',n).elo,d:stat('Daniel',n).elo,avg:(stat('Madeline',n).elo+stat('Daniel',n).elo)/2}))
   .sort((a,b)=>b.avg-a.avg);

 const ratingTable = ratingRows.length ? `<table class="table"><tr><th>Name</th><th>Madeline</th><th>Daniel</th></tr>${
   ratingRows.map(r=>`<tr><td>${r.name}</td><td>${r.m?ratingInfo[r.m].emoji+' '+ratingInfo[r.m].label:'—'}</td><td>${r.d?ratingInfo[r.d].emoji+' '+ratingInfo[r.d].label:'—'}</td></tr>`).join('')
 }</table>` : '<div class="small">Start rating names to see your results here.</div>';

 document.getElementById('compareBody').innerHTML=
 `<div class="section highlight card" style="min-height:0;align-items:stretch">
    <h2>🏆 Mutual favourites</h2>
    <div class="small" style="text-align:left">Names you both rated ❤️ Love it</div>
    ${pills(bothLove)}
  </div>

  <div class="section">
    <h2>💕 Strong agreement</h2>
    <div class="small" style="text-align:left">Names you both rated positively (❤️ Love it or 👍 Like it)</div>
    ${pills(bothPositive)}
  </div>

  <div class="section">
    <h2>🤝 Exact matches</h2>
    <div class="small" style="text-align:left">Names you gave exactly the same rating</div>
    ${pills(exactAgreement)}
  </div>

  <div class="section">
    <h2>🌱 Shared maybes</h2>
    ${pills(bothMaybe)}
  </div>

  <div class="section">
    <h2>❤️ Only one person loves it</h2>
    <div class="small" style="text-align:left">Worth discussing — one of you loves it, but the other doesn't rate it as a love</div>
    ${pills(oneLove)}
  </div>

  <div class="section">
    <h2>😬 Rating disagreements</h2>
    ${disagreements.length ? `<table class="table"><tr><th>Name</th><th>Madeline</th><th>Daniel</th></tr>${
      disagreements.map(r=>`<tr><td>${r.name}</td><td>${ratingInfo[r.m].emoji} ${ratingInfo[r.m].label}</td><td>${ratingInfo[r.d].emoji} ${ratingInfo[r.d].label}</td></tr>`).join('')
    }</table>` : '<div class="small">No disagreements yet.</div>'}
  </div>

  <div class="section">
    <h2>📋 All rating results</h2>
    ${ratingTable}
  </div>

  <div class="section">
    <h2>⏳ Still to rate</h2>
    <div class="small" style="text-align:left">Rated by only one person: ${incomplete.length} · Not rated by either of you: ${unrated.length}</div>
    ${pills(incomplete)}
  </div>

  <div class="section">
    <h2>🥊 Combined head-to-head ranking</h2>
    <div class="small" style="text-align:left">Based on your separate head-to-head choices. Scores become more meaningful as you each make more comparisons.</div>
    <table class="table"><tr><th>#</th><th>Name</th><th>Madeline</th><th>Daniel</th><th>Combined</th></tr>${
      rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.name}</td><td>${Math.round(r.m)}</td><td>${Math.round(r.d)}</td><td><b>${Math.round(r.avg)}</b></td></tr>`).join('')
    }</table>
  </div>`
}
document.getElementById('a').onclick=()=>vote(pair[0],pair[1]);document.getElementById('b').onclick=()=>vote(pair[1],pair[0]);
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active');if(b.dataset.tab==='compare')renderCompare()});
if(person)setPerson(person);
</script></body></html>
